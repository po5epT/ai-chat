services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "FRONTEND_DOMAIN_NAME=${FRONTEND_DOMAIN_NAME}"
    volumes:
      - certs_data:/etc/letsencrypt
      - /var/log/nginx:/var/log/nginx
    container_name: ai_nginx
    restart: unless-stopped
   
  ai-front:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai_front
    restart: unless-stopped
    ports:
      - "5173:5173"

volumes:
  certs_data:
    driver: local


